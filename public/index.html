<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
/* Layout: helskärms-3D. Text ligger som skyltar i hörnen; allt annat är rummet och fotona. */
:root {
  --ink: #070909;
  --paper: #e9e6df;
  --dim: #8f9693;
  --petrol: #4fb3a9;
  --signal: #d23a2c;
  --sodium: #e3a33b;
  --line: rgba(233,230,223,.18);
  --glass: rgba(7,9,9,.62);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--ink); color: var(--paper); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
.ui { position: fixed; z-index: 3; pointer-events: none; }
.ui button { pointer-events: auto; }
button { font: inherit; }

/* laddning */
.loader { position: fixed; inset: 0; z-index: 10; background: var(--ink); display: grid; place-items: center; transition: opacity .9s ease;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.loader.done { opacity: 0; pointer-events: none; }
.loader .box { width: min(420px, 100%); display: grid; gap: 14px; }
.loader .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.loader h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 18vw, 120px); line-height: .82; letter-spacing: .01em; text-transform: uppercase; }
.loader .bar { height: 2px; background: rgba(233,230,223,.12); }
.loader .bar i { display: block; height: 100%; width: 0; background: var(--petrol); transition: width .2s linear; }
.loader .step { font-family: var(--font-mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

/* intro */
.intro { left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 140px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(4,6,6,.88), rgba(4,6,6,0));
  display: flex; align-items: flex-end; gap: 18px 36px; flex-wrap: wrap; transition: opacity .7s ease, transform .7s ease; }
.intro.gone { opacity: 0; transform: translateY(24px); visibility: hidden; }
.intro h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(72px, 19vw, 240px); line-height: .78; letter-spacing: .005em; text-transform: uppercase; }
.intro .side { max-width: 38ch; min-width: 0; padding-bottom: .4em; display: grid; gap: 14px; }
.intro .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.intro p { margin: 0; font-size: 14px; color: #c9c7c0; }
.intro .row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; pointer-events: auto; font-weight: 600; font-size: 14px; padding: 11px 16px; background: var(--paper); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--paper); border: 1px solid var(--line); }
.btn:hover, .btn:focus-visible { background: var(--petrol); color: var(--ink); }
.btn.ghost:hover, .btn.ghost:focus-visible { border-color: var(--petrol); background: transparent; color: var(--paper); }

.top { top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.chip { all: unset; cursor: pointer; pointer-events: auto; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; padding: 8px 12px;
  border: 1px solid var(--line); background: var(--glass); color: var(--paper); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: inline-flex; gap: 8px; align-items: center; }
.chip:hover, .chip:focus-visible { border-color: var(--petrol); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.chip[aria-pressed="true"] .dot { background: var(--petrol); box-shadow: 0 0 8px var(--petrol); }

.where { left: 0; bottom: 0; padding: 0 0 calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; color: var(--dim); max-width: calc(100vw - 32px); }
.where .room { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--paper); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.where .room span { color: var(--petrol); margin-right: 10px; }
.where .room b { font-weight: inherit; }
.rooms { right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 0; display: flex; gap: 6px; }
.rooms button { all: unset; cursor: pointer; pointer-events: auto; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; padding: 7px 10px;
  border: 1px solid var(--line); background: var(--glass); color: var(--dim); display: inline-flex; gap: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.rooms button b { font-weight: 400; color: var(--paper); }
.rooms button:hover, .rooms button:focus-visible { border-color: var(--petrol); }
.rooms button[aria-current="true"] { border-color: var(--petrol); color: var(--petrol); }
.tourbar { left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.tourbar .tinfo { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; text-shadow: 0 1px 12px rgba(0,0,0,.95); }
.tourbar .troom { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--petrol); text-transform: uppercase; }
.tourbar b { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.tourbar .tcount { font-family: var(--font-mono); font-size: 11px; color: var(--dim); margin-left: auto; }
.tourbar .tbtns { display: flex; gap: 8px; }
.tourbar .tbtns .btn { flex: 1; text-align: center; white-space: nowrap; }
.tourbar .tbtns .chip { white-space: nowrap; }
.tourbar .chip { justify-content: center; }
.tourbar .chip:disabled { opacity: .35; cursor: default; }
.fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 4; }
.fade.on { opacity: 1; }
.cross { left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--paper); opacity: .75; }
.aim { left: 50%; top: calc(50% + 18px); transform: translateX(-50%); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
.aim small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 10px; letter-spacing: .06em; color: var(--dim); text-transform: none; }
.toast { left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); padding: 11px 14px; font-size: 13px;
  background: rgba(7,9,9,.9); border: 1px solid var(--line); opacity: 0; transition: opacity .4s; }
.toast.on { opacity: 1; }

/* fotovy: mörk yta för nattbilder, ljus för naturbilder */
.lightbox { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: #090a0a; color: var(--paper);
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox.light { background: #e8e5de; color: #1b1c1a; }
.lightbox figure { margin: 0; display: grid; gap: 14px; justify-items: start; max-width: 100%; }
.lightbox { cursor: zoom-out; }
.lightbox img { max-width: min(92vw, 1500px); max-height: 72vh; display: block; }
.lightbox figcaption { display: flex; gap: 4px 18px; flex-wrap: wrap; align-items: baseline; }
.lightbox .t { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
.lightbox .e { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; opacity: .65; }
.lightbox .close { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); min-height: 44px; padding-inline: 22px; }
body.viewing #soundBtn { visibility: hidden; pointer-events: none; }
.lightbox.light .close { background: rgba(255,255,255,.6); color: #1b1c1a; border-color: rgba(0,0,0,.2); }

.panel { position: fixed; inset: 0; z-index: 7; overflow-y: auto; background: rgba(6,8,8,.95); color: var(--paper);
  padding: calc(64px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel .inner { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
.panel .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 10vw, 96px); line-height: .82; text-transform: uppercase; text-wrap: balance; }
.panel .body { display: grid; gap: 12px; }
.panel p { margin: 0; max-width: 62ch; color: #cfccc4; }
.panel .placeholder { border: 1px dashed var(--line); padding: 12px 14px; color: var(--dim); font-size: 13px; }
.panel h3 { margin: 18px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
.panel .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.panel .grid button { all: unset; cursor: pointer; display: grid; gap: 6px; min-width: 0; }
.panel .grid button:focus-visible img { outline: 2px solid var(--petrol); outline-offset: 2px; }
.panel .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.panel .grid span { font-size: 12px; color: var(--dim); }
.panel .go { justify-self: start; }
.panel .tourgo { justify-self: start; margin-top: 6px; }
.panel .tour { display: grid; border-top: 1px solid var(--line); }
.panel .tour button { all: unset; cursor: pointer; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; padding: 16px 6px; border-bottom: 1px solid var(--line); transition: background .2s; }
.panel .tour button:hover, .panel .tour button:focus-visible { background: rgba(236,233,224,.05); }
.panel .tour button:focus-visible { outline: 2px solid var(--petrol); outline-offset: -2px; }
.panel .tour .n { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; color: var(--dim); }
.panel .tour .t { display: grid; gap: 2px; min-width: 0; }
.panel .tour b { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 34px); letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.panel .tour small { font-size: 13px; color: var(--dim); }
.panel .tour .ar { font-size: 20px; color: var(--dim); }
.panel .close { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 1; }
@media (max-width: 640px) { .where .room { font-size: 22px; } .brand { font-size: 15px; } .rooms button b { display: none; } .where { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .intro, .loader, .toast { transition: none; } }
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="En bättre bilds showroom: fyra rum med fotografier att gå runt i"></canvas>

<div class="loader" id="loader">
  <div class="box">

</div>

</header>

<section class="ui intro" id="intro" hidden>
  <h1 id="introName">Staden</h1>

    <div class="eyebrow" id="introEyebrow">Rum 01 · Betong, stål och kallt ljus</div>

    <div class="row">
      <button type="button" class="btn" id="enterSound">Kliv in med ljud</button>
      <button type="button" class="btn ghost" id="enterQuiet">Utan ljud</button>
    </div>
  </div>
</section>

<div class="ui where" id="where" hidden>
  <div class="room"><span id="roomNum">01</span><b id="roomName">Staden</b></div>
  <div id="hint"></div>
</div>
<div class="ui cross" id="cross" hidden></div>
<div class="ui aim" id="aim" hidden></div>
<nav class="ui rooms" id="rooms" hidden aria-label="Rum">
  <button type="button" data-room="foajen"><span>00</span><b>Foajén</b></button>
  <button type="button" data-room="staden"><span>01</span><b>Staden</b></button>
  <button type="button" data-room="naturen"><span>02</span><b>Naturen</b></button>

<div class="ui tourbar" id="tour" hidden>

  <div class="tbtns">
    <button type="button" class="chip" id="tourPrev" aria-label="Föregående bild">←</button>
    <button type="button" class="btn" id="tourNext">Nästa bild →</button>
    <button type="button" class="chip" id="tourEnd">Avsluta ✕</button>
  </div>
</div>
<div class="fade" id="fade"></div>
<div class="ui toast" id="toast" role="status"></div>

<section class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">

</section>

<script>

/* ================= 01 STADEN =================

   En neonskylt, CITYVIBE, står på golvet lutad mot glaset. En liten ståltrappa med fyra steg leder upp till en dörr vidare.

const CV = { X: 6, L: 22, H: 5.4, PIL: [[-2.9, -7.3], [2.9, -7.3], [-2.9, -14.6], [2.9, -14.6]], PW: .56,

      tour.addEventListener("click", () => { closePanel(); tourStart(); }); b.append(tour);
      const h3 = document.createElement("h3"); h3.textContent = "Eller börja i"; b.append(h3);
      const list = document.createElement("div"); list.className = "tour"; b.append(list);
      for (const k of ["staden", "naturen", "berattelser", "manniskorna"]) { const S = SPECS[k], bt = document.createElement("button"); bt.type = "button";
        const n = document.createElement("span"); n.className = "n"; n.textContent = S.num;
        const t = document.createElement("span"); t.className = "t"; const nb = document.createElement("b"); nb.textContent = S.name; const sb = document.createElement("small"); sb.textContent = S.sub; t.append(nb, sb);
        const ar = document.createElement("span"); ar.className = "ar"; ar.textContent = "→";
        bt.append(n, t, ar); bt.addEventListener("click", () => { closePanel(); goRoom(k); }); list.append(bt); }
    } else if (kind === "galleri") {
      head("Foajén · Galleri", "Galleri"); para("Alla bilder från rummen. Tryck på en bild för att se den i full storlek.");
      for (const k of ["foajen", "staden", "naturen", "berattelser", "manniskorna"]) {
        const S = SPECS[k], h3 = document.createElement("h3"); h3.textContent = S.num + "  " + S.name; b.append(h3);
        const grid = document.createElement("div"); grid.className = "grid"; b.append(grid);
        S.slots.filter((sl) => PHOTOS[sl.key].src).forEach((sl) => { const Ph = PHOTOS[sl.key], bt = document.createElement("button"); bt.type = "button";
          const im = document.createElement("img"); im.src = Ph.src; im.alt = Ph.title; im.loading = "lazy"; const sp = document.createElement("span"); sp.textContent = Ph.title;
          bt.append(im, sp); bt.addEventListener("click", () => openPhoto(sl.key)); grid.append(bt); });
        const go = document.createElement("button"); go.type = "button"; go.className = "chip go"; go.textContent = "Gå till " + S.name + " →"; go.addEventListener("click", () => { closePanel(); goRoom(k); }); b.append(go);
      }
    } else if (kind === "om") {
      head("Foajén · Om", "En bättre bild"); para("Fotografi i staden, i naturen och bilder som bär en berättelse.");
      para("Här kommer din presentation: vem du är, hur du arbetar och vad du helst fotograferar. Skicka texten så lägger jag in den.", "placeholder");
    } else if (kind === "priser") {
      head("Foajén · Priser", "Priser"); para("Priser och paket kommer snart.");
      para("Skicka dina paket och priser, så blir det här en tydlig prislista.", "placeholder");
    } else {
      head("Foajén · Kontakt", "Kontakt"); para("Vill du boka en fotografering? Kontaktuppgifterna kommer här snart.");
      para("Skicka e-post, telefon och gärna Instagram, så blir det här en bokningssida.", "placeholder");
    }
    panel.hidden = false; document.body.classList.add("viewing"); panel.scrollTop = 0; $("panelClose").focus();
  }
  function closePanel() { if (panel.hidden) return; panel.hidden = true; lbClosedAt = performance.now(); canvas.focus({ preventScroll: true }); setTimeout(() => { if (lb.hidden) document.body.classList.remove("viewing"); }, 700); }
  $("panelClose").addEventListener("click", closePanel);
  let toastTimer; function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3800); }
  function updateHint() {
    $("hint").textContent = isTouch ? "Dra med ett finger för att se dig om · tryck på golvet för att gå dit · tryck på ett foto eller en dörr"
      : locked ? "Musen tittar · klicka på golvet för att gå dit, på ett foto för att öppna det eller på en dörr · W A S D går · Esc släpper musen"
      : lockFailed ? "För musen mot skärmkanten för att vända dig · klicka på golvet för att gå · W A S D eller piltangenter"
      : "Klicka i rummet för att styra med musen igen · eller för musen mot kanten för att vända dig";
    $("cross").hidden = !locked;
  }
  function enter(withSound) {
    entered = true; $("intro").classList.add("gone"); $("where").hidden = false; $("rooms").hidden = false; updateHint();
    if (withSound) Sound.set(true);
    setTimeout(() => { $("intro").hidden = true; }, 800);
  }
  $("enterSound").addEventListener("click", () => { enter(true); lock(); });
  $("enterQuiet").addEventListener("click", () => { enter(false); lock(); });
  document.querySelectorAll("#rooms button").forEach((b) => b.addEventListener("click", () => { b.blur(); canvas.focus({ preventScroll: true }); goRoom(b.dataset.room); }));
  addEventListener("hashchange", () => { const k = location.hash.slice(1); if (SPECS[k] && k !== currentKey) goRoom(k); });

  /* ================= guidad tur: från bild till bild genom alla rum ================= */
  const tour = { on: false, stops: [], i: -1, anim: null };
  const tourEl = $("tour"), fadeEl = $("fade");
  function segClear(ax, az, bx, bz) { const n = Math.ceil(Math.hypot(bx - ax, bz - az) / .2); for (let k = 1; k < n; k++) { const t = k / n; if (blocked(ax + (bx - ax) * t, az + (bz - az) * t)) return false; } return true; }
  // var man ska stå för att se en bild: rakt framför, på ett avstånd som passar bildens storlek
  // fri sikt från ögonhöjd till bilden, mätt mot rummets väggar och de fasta volymerna
  const eyeFor = (C) => clamp(C[1] - EYE, -.3, .9);
  function canSee(px, pz, C, N) {
    const tx = C[0] + N[0] * .15, ty = C[1], tz = C[2] + N[2] * .15, n = 40, ey = EYE + eyeFor(C);
    for (let k = 1; k < n; k++) { const t = k / n, x = px + (tx - px) * t, y = ey + (ty - ey) * t, z = pz + (tz - pz) * t;
      if (Math.min(SDF(x, y, z), objSDF(x, y, z, null)) < .04) return false; }
    return true;
  }
  // var man ska stå: rakt framför bilden på ett avstånd som passar storleken, där man kan stå och ser bilden fritt
  function viewFor(art) {
    const C = art.slot.C, N = art.slot.N, size = Math.max(art.w || 1, art.h || 1), ideal = clamp(size * 1.3 + .7, 2, 4.4);
    const ds = []; for (let d = 1.2; d <= 7; d += .15) ds.push(d); ds.sort((a, b) => Math.abs(a - ideal) - Math.abs(b - ideal));
    let best = null;
    for (const d of ds) { const x = C[0] + N[0] * d, z = C[2] + N[2] * d; if (!blocked(x, z) && canSee(x, z, C, N)) { best = { x, z }; break; } }
    if (!best) { const c = clampWalk(C[0] + N[0] * ideal, C[2] + N[2] * ideal); best = { x: c.x, z: c.z }; }
    const dx = C[0] - best.x, dz = C[2] - best.z, h = Math.max(.3, Math.hypot(dx, dz));
    const eo = eyeFor(C); // rakt framifrån: ögat i bildens höjd, blicken vågrät
    return { x: best.x, z: best.z, yaw: Math.atan2(-dx, -dz), pitch: clamp(Math.atan2(C[1] - EYE - eo, h), -.5, .5), eyeOff: eo };
  }
  // ordningen: närmaste bild härnäst, men helst utan att behöva gå genom en vägg
  function tourStops() {
    const list = arts.filter((a) => PHOTOS[a.slot.key] && PHOTOS[a.slot.key].src).map((a) => ({ art: a, v: viewFor(a) })), out = [];
    let cx = player.x, cz = player.z;
    while (list.length) { let bi = 0, bd = 1e9;
      list.forEach((st, i) => { const d = Math.hypot(st.v.x - cx, st.v.z - cz) + (segClear(cx, cz, st.v.x, st.v.z) ? 0 : 25); if (d < bd) { bd = d; bi = i; } });
      const st = list.splice(bi, 1)[0]; out.push(st); cx = st.v.x; cz = st.v.z; }
    return out;
  }
  function tourStart() { unlock(); tour.on = true; tour.stops = []; tour.i = -1; goRoom("staden"); }
  function tourStop() { tour.on = false; tour.anim = null; tourEl.hidden = true; if (entered) { $("where").hidden = false; $("rooms").hidden = false; } }
  function tourEnter() {
    if (currentKey === "foajen") { tourStop(); return; }
    tour.stops = tourStops(); tour.i = -1; tour.anim = null; tourUI();
    if (tour.stops.length) setTimeout(() => { if (tour.on && tour.i < 0) tourGo(0); }, reduceMotion ? 300 : 1000);
  }
  function tourGo(i) {
    if (!tour.stops.length) return;
    tour.i = clamp(i, 0, tour.stops.length - 1); const v = tour.stops[tour.i].v; walkTarget = null;
    if (reduceMotion || !segClear(player.x, player.z, v.x, v.z)) { // går inte att glida dit: tona till svart och flytta
      tour.anim = null; fadeEl.classList.add("on");
      setTimeout(() => { Object.assign(player, { x: v.x, z: v.z, yaw: v.yaw, pitch: v.pitch, eyeOff: v.eyeOff }); fadeEl.classList.remove("on"); }, reduceMotion ? 0 : 320);
    } else { let dy = v.yaw - player.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      tour.anim = { t: 0, T: clamp(Math.hypot(v.x - player.x, v.z - player.z) / 1.5, .9, 3.2), from: { x: player.x, z: player.z, yaw: player.yaw, pitch: player.pitch, eyeOff: player.eyeOff }, to: { x: v.x, z: v.z, yaw: player.yaw + dy, pitch: v.pitch, eyeOff: v.eyeOff } }; }
    tourUI();
  }
  function tourNext() {
    if (loading) return;
    if (tour.i < tour.stops.length - 1) { tourGo(tour.i + 1); return; }
    const nx = SPECS[currentKey].next; tour.anim = null;
    if (!nx || nx === "foajen") { tourStop(); goRoom("foajen"); setTimeout(() => toast("Det var hela vernissagen. Tack för att du tittade!"), 1400); }
    else goRoom(nx);
  }
  function tourPrev() { if (!loading && tour.i > 0) tourGo(tour.i - 1); }
  function tourUI() {
    if (!tour.on) return; tourEl.hidden = false; $("where").hidden = true; $("rooms").hidden = true;
    const S = SPECS[currentKey], n = tour.stops.length, last = tour.i >= n - 1;
    $("tourRoom").textContent = S.num + "  " + S.name;
    $("tourTitle").textContent = !n ? "Inga bilder här ännu" : tour.i >= 0 ? PHOTOS[tour.stops[tour.i].art.slot.key].title : "";
    $("tourCount").textContent = n && tour.i >= 0 ? (tour.i + 1) + " / " + n : "";
    $("tourPrev").disabled = tour.i <= 0;
    $("tourNext").textContent = n && !last ? "Nästa bild →" : S.next === "foajen" ? "Avsluta turen →" : "Nästa: " + SPECS[S.next].name + " →";
  }
  $("tourNext").addEventListener("click", (e) => { e.currentTarget.blur(); tourNext(); });
  $("tourPrev").addEventListener("click", (e) => { e.currentTarget.blur(); tourPrev(); });
  $("tourEnd").addEventListener("click", () => { tourStop(); toast("Turen är avslutad. Gå runt fritt, eller välj ett rum nere till höger."); });

  /* ================= loop ================= */
  let last = performance.now();
  let frameEMA = 16, lastQ = 0, lastAim = 0, lastHover = 0, lowTier = false;
  // ?debug visar bildfrekvens, upplösning och grafikkort
  const dbg = /[?&]debug/.test(location.search) ? Object.assign(document.body.appendChild(document.createElement("div")), { style: "position:fixed;left:8px;top:40px;z-index:20;font:11px/1.4 monospace;color:#9fe;background:rgba(0,0,0,.6);padding:4px 6px;pointer-events:none;white-space:pre" }) : null;
  let dbgT = 0, dbgN = 0, gpuName = "?";
  if (dbg) { window.__scene = scene; window.__cam = camera; }
  if (dbg) window.__setView = (v) => { player.x = v[0]; player.z = v[1]; player.yaw = v[2]; player.pitch = v[3] || 0; };
  try { const gl = renderer.getContext(), ext = gl.getExtension("WEBGL_debug_renderer_info"); if (ext) gpuName = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL); } catch (e) {}
  function frame(now) {
    const raw = now - last, dt = Math.min(.05, raw / 1000); last = now;
    // håll bildfrekvensen jämn: sänk upplösningen om det går tungt, höj igen när det finns marginal
    if (raw < 120) frameEMA = frameEMA * .94 + raw * .06;
    if (dbg) { dbgN++; if (now - dbgT > 500) { const c = renderer.domElement; dbg.textContent = (dbgN * 1000 / (now - dbgT)).toFixed(0) + " fps · " + c.width + "×" + c.height + " · kvalitet " + quality.toFixed(2) + (lowTier ? " · låg nivå" : "") + "\n" + gpuName; dbgT = now; dbgN = 0; } }
    if (roomReady && !loading && now - lastQ > 1800) { lastQ = now;
      const minQ = lowTier ? .65 : isTouch ? .75 : .85;
      if (!lowTier && !isTouch && frameEMA > 24 && quality <= minQ + .001) { lowTier = true; if (bloomPass) bloomPass.enabled = false; }
      if (frameEMA > 26 && quality > minQ) { quality = Math.max(minQ, quality - .075); applyQuality(); }
      else if (frameEMA < 18 && quality < 1) { quality = Math.min(1, quality + .075); applyQuality(); } }
    if (roomReady) {
      if (entered && !loading) {
        if (tour.anim && (walkTarget || ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown"].some((k) => keys[k]))) tour.anim = null; // egen rörelse avbryter glidningen
        if (tour.anim) { const A = tour.anim; A.t = Math.min(1, A.t + Math.min(.25, raw / 1000) / A.T); const t = A.t, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          const nx = A.from.x + (A.to.x - A.from.x) * e, nz = A.from.z + (A.to.z - A.from.z) * e, mv = Math.hypot(nx - player.x, nz - player.z);
          player.x = nx; player.z = nz; player.yaw = A.from.yaw + (A.to.yaw - A.from.yaw) * e; player.pitch = A.from.pitch + (A.to.pitch - A.from.pitch) * e; player.eyeOff = A.from.eyeOff + (A.to.eyeOff - A.from.eyeOff) * e;
          if (mv > 0) { bob += mv * 5.2; stepAcc += mv; if (stepAcc > .72) { stepAcc = 0; stepSide = -stepSide; Sound.step(stepSide); } }
          if (t >= 1) tour.anim = null; }
        let f = 0, s = 0;
        if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1; if (keys.KeyD) s += 1; if (keys.KeyA) s -= 1;
        if (keys.ArrowLeft) player.yaw += 1.7 * dt; if (keys.ArrowRight) player.yaw -= 1.7 * dt;
        const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw); let dx = 0, dz = 0, speed = keys.ShiftLeft || keys.ShiftRight ? 3.4 : 1.8;
        if (f || s) { walkTarget = null; const l = Math.hypot(f, s); f /= l; s /= l; dx = (-sy * f + cy * s) * speed * dt; dz = (-cy * f - sy * s) * speed * dt; }
        else if (walkTarget) { const tx = walkTarget.x - player.x, tz = walkTarget.z - player.z, d = Math.hypot(tx, tz); if (d < .08) walkTarget = null; else { const st = Math.min(d, 1.6 * dt); dx = tx / d * st; dz = tz / d * st; } }
        let moved = 0;
        if (dx && !blocked(player.x + dx, player.z)) { player.x += dx; moved += Math.abs(dx); } else if (dx && walkTarget) walkTarget = null;
        if (dz && !blocked(player.x, player.z + dz)) { player.z += dz; moved += Math.abs(dz); } else if (dz && walkTarget) walkTarget = null;
        if (player.eyeOff && !tour.anim && (moved > 0 || !tour.on)) { player.eyeOff *= Math.exp(-dt * 3); if (Math.abs(player.eyeOff) < .005) player.eyeOff = 0; } // går man själv sjunker blicken tillbaka
        if (moved > 0) { bob += moved * 5.2; stepAcc += moved; if (stepAcc > .72) { stepAcc = 0; stepSide = -stepSide; Sound.step(stepSide); } }
        if (!tour.anim) for (const ex of exits) if (player.x > ex.x0 && player.x < ex.x1 && player.z > ex.z0 && player.z < ex.z1) { goRoom(ex.to); break; }
      }
      if (entered && !locked && !isTouch && mouse && !drag && lb.hidden) {
        const nx = mouse.x / innerWidth * 2 - 1, ny = mouse.y / innerHeight * 2 - 1, E = .62;
        if (Math.abs(nx) > E) player.yaw -= Math.sign(nx) * Math.pow((Math.abs(nx) - E) / (1 - E), 1.5) * 1.9 * dt;
        if (Math.abs(ny) > .7) player.pitch = clamp(player.pitch - Math.sign(ny) * Math.pow((Math.abs(ny) - .7) / .3, 1.5) * .9 * dt, -.9, .9);
      }
      if (lookDX || lookDY) { const f = 1; const ax = lookDX * f, ay = lookDY * f; look(ax, ay, .0022); lookDX -= ax; lookDY -= ay; if (Math.abs(lookDX) < .01 && Math.abs(lookDY) < .01) { lookDX = 0; lookDY = 0; } }
      camera.position.set(player.x, EYE + player.eyeOff + (reduceMotion ? 0 : Math.sin(bob) * .016), player.z);
      camera.rotation.set(player.pitch, player.yaw, 0);
      if (RT && RT.update) RT.update(now, dt);
      if (dustMat) dustMat.uniforms.time.value = now / 1000;
      if (marker && markerT > 0) { markerT = Math.max(0, markerT - dt * .9); marker.material.opacity = markerT; marker.scale.setScalar(1 + (1 - markerT) * .6); }
      if (!lb.hidden) { requestAnimationFrame(frame); return; } // fotot täcker allt: rita inte rummet bakom
      renderMirror();
      if (composer) { finalPass.uniforms.time.value = now / 1000; composer.render(); } else renderer.render(scene, camera);
      if (entered && locked && !loading) {
        if (now - lastAim > 120) { lastAim = now;
          const a = pickNDC(0, 0);
          if (a && ((a.art && a.dist < 9) || (a.exit && a.dist < 7) || (a.menu && a.dist < 7))) {
            aimEl.innerHTML = ""; const ex = a.exit && exits.find((e) => e.to === a.exit);
            aimEl.append(a.art ? PHOTOS[a.art.slot.key].title : a.menu ? a.title : (ex ? ex.title : SPECS[a.exit].name));
            const sm = document.createElement("small"); sm.textContent = a.exit ? "klicka för att gå in" : "klicka för att öppna"; aimEl.append(sm); aimEl.hidden = false;
          } else aimEl.hidden = true; }
      } else aimEl.hidden = true;
    }
    requestAnimationFrame(frame);
  }

  setupPost(); addEventListener("resize", resize); resize();
  requestAnimationFrame(frame);
  const startKey = SPECS[location.hash.slice(1)] ? location.hash.slice(1) : "foajen";
  goRoom(startKey, true).then((S) => {
    $("introName").textContent = S.name; $("introEyebrow").textContent = (S.num === "00" ? "Entré" : "Rum " + S.num) + " · " + S.sub; $("introText").textContent = S.intro;
    setTimeout(() => { $("intro").hidden = false; }, 250);
  }).catch((e) => { console.error(e); });
})();

</script>
